<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f1a17" />
    <!-- SVG y no PNG: el sello se ve nitido en la pestana a cualquier densidad
         de pantalla y son 400 bytes en vez de tres ficheros. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Para poder guardarse la web en la pantalla de inicio.

      El manifiesto que va aqui es el del sitio entero. En las pantallas de
      socio se cambia por otro en marcha -ver `useManifiesto.js`-, para que lo
      que quede en el movil sea la tarjeta y no la portada.

      Las dos etiquetas de Apple son necesarias aparte: iOS no lee el
      manifiesto. El icono tiene que ser PNG y sin transparencia, y
      apple-mobile-web-app-title es lo que sale debajo del icono; sin ella iOS
      coge el titulo de la pestana, "Grupo Cobama", y lo corta.

      OJO: aqui no se puede escribir la etiqueta de titulo entre signos de
      menor y mayor, ni siquiera dentro de un comentario como este. La API
      quita el titulo de la plantilla con una expresion regular que busca el
      primero que aparezca -ver `api/src/middleware/prerender.js`-, y si lo
      encuentra aqui se lleva por delante el cierre de este comentario. El
      resultado es una pagina en blanco EN PRODUCCION que en desarrollo se ve
      perfecta, porque Vite sirve el fichero sin pasar por esa expresion.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icono/icono-apple-180.png" />
    <meta name="apple-mobile-web-app-title" content="Cobama" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Grupo Cobama</title>
    <meta
      name="description"
      content="Cuatro guachinches de cocina canaria en Tenerife: Como en Casa, La Basilica, La Casa del Mago y El Descarado."
    />
  </head>
  <body>
    <script>
      // Va aqui y no en React a proposito: tiene que ejecutarse ANTES del
      // primer pintado. Si el tema se aplicara al montar el componente, cada
      // carga empezaria con un fogonazo blanco, que es lo que peor sienta
      // abriendo la carta de noche en la mesa.
      // En linea y sin fichero aparte por lo mismo: un <script src> es otra
      // peticion, y el fogonazo dura lo que tarde en llegar.
      (function () {
        try {
          var guardado = localStorage.getItem('cobama-tema');
          var oscuro = guardado
            ? guardado === 'oscuro'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (oscuro) document.documentElement.dataset.tema = 'oscuro';
        } catch (e) {
          // Sin localStorage (navegacion privada) se queda en claro. Que no
          // se pueda recordar la eleccion no puede impedir que cargue la web.
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
