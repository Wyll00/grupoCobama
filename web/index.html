<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f1a17" />
    <!-- SVG y no PNG: el sello se ve nitido en la pestana a cualquier densidad
         de pantalla y son 400 bytes en vez de tres ficheros. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Grupo Cobama · Cocina canaria en Tenerife</title>
    <meta
      name="description"
      content="Cuatro guachinches de cocina canaria en Tenerife: Como en Casa, La Basilica, La Casa del Mago y El Descarado."
    />
  </head>
  <body>
    <script>
      // Va aqui y no en React a proposito: tiene que ejecutarse ANTES del
      // primer pintado. Si el tema se aplicara al montar el componente, cada
      // carga empezaria con un fogonazo blanco, que es lo que peor sienta
      // abriendo la carta de noche en la mesa.
      // En linea y sin fichero aparte por lo mismo: un <script src> es otra
      // peticion, y el fogonazo dura lo que tarde en llegar.
      (function () {
        try {
          var guardado = localStorage.getItem('cobama-tema');
          var oscuro = guardado
            ? guardado === 'oscuro'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (oscuro) document.documentElement.dataset.tema = 'oscuro';
        } catch (e) {
          // Sin localStorage (navegacion privada) se queda en claro. Que no
          // se pueda recordar la eleccion no puede impedir que cargue la web.
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
